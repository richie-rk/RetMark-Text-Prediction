[paths]
data_dir = "data"

[model]
d_model = 64
mlp_hidden = 256
boundary_chars = [".", "?", "!", "\n"]
boundary_decay = 0.7
fast_decay = 0.9
init_std = 0.02
seed = 1234

[predict]
top_k = 3
word_extend_max_tokens = 4
debounce_ms = 50

[graph]
spike_prob = 0.8
spike_min_count = 5

[handover]
window = 500

[train]
online_lr = 3e-4
online_update_sentences = 4
online_update_max_tokens = 256
consolidation_lr = 1e-3
consolidation_epochs = 2
replay_ratio = 1.0
batch_size = 32
bptt_window = 128
grad_clip = 1.0
adam_beta1 = 0.9
adam_beta2_half_life_tokens = 10_000_000
adam_eps = 1e-8

[correct]
dialect = "both"  # accept a word correct in either British or American spelling
max_edit_distance = 2
harper_ls_path = ""  # empty: find harper-ls on PATH

[persist]
checkpoint_interval_s = 300

[logs]
flush_interval_s = 5

[dictionary]
candidate_min_count = 3

[eval]
holdout_min_sentences = 500
top3_floor = 0.25
