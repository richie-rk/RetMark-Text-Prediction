[project]
name = "predictive-keyboard"
version = "0.1.0"
description = "Local predictive-text engine that learns from the user's own typing"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "regex",
    "tiktoken",
    "safetensors",
    "prompt_toolkit",
    "rich",
    "typer",
]

[project.scripts]
pk = "pk.cli.main:main"

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
